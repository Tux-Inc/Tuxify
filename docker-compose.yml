version: "3"

# Every Node service runs from the same development image (Dockerfile.dev),
# which holds the whole pnpm workspace; only the sources are mounted.
x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  # PostgreSQL auth database
  api_auth_db:
    container_name: tuxify-api-auth-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./dabatase/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tuxify-network

  # PostgreSQL providers database
  api_providers_db:
    container_name: tuxify-api-providers-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${NESTSV_PROVIDERS_POSTGRES_PASSWORD}
      POSTGRES_USER: ${NESTSV_PROVIDERS_POSTGRES_USER}
      POSTGRES_DB: ${NESTSV_PROVIDERS_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - providers_data:/var/lib/postgresql/data
      - ./dabatase/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tuxify-network

  # MongoDB Flows database
  api_flows_db:
    container_name: tuxify-api-flows-db
    image: mongo:latest
    restart: unless-stopped
    command: --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NESTSV_FLOWS_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NESTSV_FLOWS_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${NESTSV_FLOWS_MONGO_DB}
    volumes:
      - flows_data:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - tuxify-network

  # Redis auth cache
  api_auth_cache:
    container_name: tuxify-api-auth-cache
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tuxify-network

  # Nest microservices NATS transport server
  api_nats:
    container_name: tuxify-api-nats
    image: nats:latest
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    networks:
      - tuxify-network

  # Nest API services
  api_gateway:
    container_name: tuxify-api-gateway
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/gateway
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./backend/gateway:/repo/backend/gateway
      - /repo/backend/gateway/node_modules
    networks:
      - tuxify-network
    env_file:
      - .env

  # Mailer microservice
  api_mailer:
    container_name: tuxify-api-mailer
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/mailer
    volumes:
      - ./backend/mailer:/repo/backend/mailer
      - /repo/backend/mailer/node_modules
    networks:
      - tuxify-network
    env_file:
      - .env

  # Auth microservice
  api_auth:
    container_name: tuxify-api-auth
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/auth
    ports:
      - ${NESTSV_AUTH_PORT}:${NESTSV_AUTH_PORT}
    volumes:
      - ./backend/auth:/repo/backend/auth
      - /repo/backend/auth/node_modules
    depends_on:
      - api_auth_db
      - api_auth_cache
    networks:
      - tuxify-network
    env_file:
      - .env

  # Flows microservice
  api_flows:
    container_name: tuxify-api-flows
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/flows
    volumes:
      - ./backend/flows:/repo/backend/flows
      - /repo/backend/flows/node_modules
    depends_on:
      - api_flows_db
    networks:
      - tuxify-network
    env_file:
      - .env

  # Providers microservice
  api_providers:
    container_name: tuxify-api-providers
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/providers
    ports:
      - ${NESTSV_PROVIDERS_PORT}:${NESTSV_PROVIDERS_PORT}
    volumes:
      - ./backend/providers:/repo/backend/providers
      - /repo/backend/providers/node_modules
    depends_on:
      - api_providers_db
    networks:
      - tuxify-network
    env_file:
      - .env

  # Google provider
  api_google:
    container_name: tuxify-api-google
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/external-providers/google
    ports:
      - ${NESTSV_GOOGLE_PORT}:${NESTSV_GOOGLE_PORT}
    volumes:
      - ./backend/external-providers/google:/repo/backend/external-providers/google
      - /repo/backend/external-providers/google/node_modules
    depends_on:
      - api_providers
    networks:
      - tuxify-network
    env_file:
      - .env

  # Github provider
  api_github:
    container_name: tuxify-api-github
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/external-providers/github
    ports:
      - ${NESTSV_GITHUB_PORT}:${NESTSV_GITHUB_PORT}
    volumes:
      - ./backend/external-providers/github:/repo/backend/external-providers/github
      - /repo/backend/external-providers/github/node_modules
    depends_on:
      - api_providers
    networks:
      - tuxify-network
    env_file:
      - .env

  # Microsoft provider
  api_microsoft:
    container_name: tuxify-api-microsoft
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm start:dev
    working_dir: /repo/backend/external-providers/microsoft
    ports:
      - ${NESTSV_MICROSOFT_PORT}:${NESTSV_MICROSOFT_PORT}
    volumes:
      - ./backend/external-providers/microsoft:/repo/backend/external-providers/microsoft
      - /repo/backend/external-providers/microsoft/node_modules
    depends_on:
      - api_providers
    networks:
      - tuxify-network
    env_file:
      - .env

  # Nuxt Frontend
  frontend:
    container_name: tuxify-frontend
    build: *dev-build
    image: tuxify-dev:local
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0
    working_dir: /repo/frontend
    ports:
      - "8080:8080"
      - "24678:24678"
    volumes:
      - ./frontend:/repo/frontend
      - /repo/frontend/node_modules
      - /repo/frontend/.nuxt
      - /repo/frontend/.output
    depends_on:
      - api_gateway
    networks:
      - tuxify-network
    env_file:
      - .env

networks:
  tuxify-network:
    driver: bridge

volumes:
  auth_data:
  flows_data:
  providers_data:
